<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Unilabs · RouteGuide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--red:#C8281E;--red-dim:rgba(200,40,30,0.12);--dark:#0D0D0D;--surface:#171717;--card:#202020;--border:#2A2A2A;--border-soft:#222222;--text:#F0F0F0;--muted:#6E6E6E;--muted2:#4A4A4A;--green:#3A9E50;--green-dim:rgba(58,158,80,0.12);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Figtree',sans-serif;background:var(--dark);color:var(--text);max-width:480px;margin:0 auto;display:flex;flex-direction:column;height:100%;overflow:hidden}
button{font-family:'Figtree',sans-serif;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:'Figtree',sans-serif}
.mono{font-family:'DM Mono',monospace}
.app-header{flex-shrink:0;background:var(--dark);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.18em;color:var(--red);font-weight:500;text-transform:uppercase}
.brand-sep{width:1px;height:16px;background:var(--border)}
.brand-sub{font-size:12px;color:var(--muted);font-weight:500;letter-spacing:0.04em}
.btn-icon{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--border-soft)}
.btn-icon svg{width:18px;height:18px}
.btn-icon:active{background:var(--card);color:var(--text)}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{display:none}
.screen{display:none;flex-direction:column;height:100%}
.screen.active{display:flex}
#scr-list .list-header{padding:20px 20px 12px;flex-shrink:0}
.day-info{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.day-pill{font-size:12px;font-weight:500;color:var(--muted);background:var(--card);border:1px solid var(--border);padding:4px 10px;border-radius:4px;font-family:'DM Mono',monospace;letter-spacing:0.04em}
.deadline-pill{font-size:12px;font-weight:600;color:var(--red);background:var(--red-dim);padding:4px 10px;border-radius:4px;font-family:'DM Mono',monospace;letter-spacing:0.04em}
.search-wrap{position:relative;margin-bottom:14px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.search-wrap input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:14px;padding:10px 12px 10px 36px;border-radius:6px;outline:none}
.search-wrap input::placeholder{color:var(--muted)}
.filter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;font-size:12px;font-weight:500;padding:5px 12px;border-radius:4px;border:1px solid var(--border);color:var(--muted);background:none;white-space:nowrap}
.filter-chip.active{background:var(--red);border-color:var(--red);color:#fff}
.routes-list{padding:0 16px 20px}
.route-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;cursor:pointer;-webkit-user-select:none;user-select:none}
.route-item:active{background:var(--card);border-color:var(--muted2)}
.route-code{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--text);min-width:64px;letter-spacing:-0.02em}
.route-info{flex:1;min-width:0}
.route-region{font-size:13px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-meta{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}
.type-badge{font-size:10px;font-weight:600;letter-spacing:0.06em;padding:2px 7px;border-radius:3px;text-transform:uppercase}
.tp{background:rgba(200,40,30,0.1);color:#E05050}
.ts{background:rgba(180,140,0,0.12);color:#C4A000}
.tt{background:rgba(50,120,220,0.12);color:#5090D0}
.tb{background:rgba(80,160,80,0.12);color:#50A060}
.stop-count{font-size:12px;color:var(--muted)}
.route-driver{font-size:11px;color:var(--muted2);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.route-arrow{color:var(--muted2);flex-shrink:0}
.route-arrow svg{width:16px;height:16px}
#scr-overview .ov-header{padding:16px 20px 0;flex-shrink:0}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-bottom:16px;padding:0}
.back-btn svg{width:16px;height:16px}
.back-btn:active{color:var(--text)}
.ov-route-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
.ov-code{font-family:'DM Mono',monospace;font-size:36px;font-weight:500;color:var(--text);letter-spacing:-0.03em;line-height:1}
.ov-type-badge{font-size:11px;font-weight:600;letter-spacing:0.06em;padding:4px 10px;border-radius:4px;text-transform:uppercase;margin-top:6px;flex-shrink:0}
.ov-region{font-size:14px;color:var(--muted);margin-bottom:6px}
.ov-driver{font-size:12px;color:var(--muted2);font-style:italic;margin-bottom:16px}
.stats-row{display:flex;gap:8px;margin-bottom:20px}
.stat-box{flex:1;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px 12px}
.stat-label{font-size:11px;color:var(--muted);font-weight:500;margin-bottom:2px;letter-spacing:0.04em;text-transform:uppercase}
.stat-value{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--text)}
.ov-stops-header{padding:0 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;margin-bottom:10px}
.ov-stops-label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase}
.btn-edit{font-size:12px;font-weight:600;color:var(--red);padding:4px 10px;border-radius:4px;border:1px solid var(--red-dim);background:var(--red-dim)}
.stops-scroll{flex:1;overflow-y:auto;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.stops-scroll::-webkit-scrollbar{display:none}
.stop-row{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:6px}
.stop-num{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);min-width:20px;text-align:right;flex-shrink:0}
.stop-info{flex:1;min-width:0}
.stop-name{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop-time{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:1px}
.stop-obs{font-size:11px;color:#C4A000;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.drag-handle{color:var(--muted2);cursor:grab;flex-shrink:0;padding:4px}
.drag-handle svg{width:16px;height:16px;display:block}
.ov-footer{flex-shrink:0;padding:14px 20px 28px;border-top:1px solid var(--border);background:var(--dark)}
.btn-start{width:100%;height:54px;background:var(--red);color:#fff;font-size:16px;font-weight:600;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-start:active{opacity:0.85;transform:scale(0.99)}
.btn-start svg{width:18px;height:18px}
.edit-note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
#scr-active{background:var(--dark)}
.nav-top{flex-shrink:0;background:var(--surface);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.progress-wrap{flex:1}
.progress-label{display:flex;justify-content:space-between;margin-bottom:6px}
.progress-route{font-family:'DM Mono',monospace;font-size:12px;color:var(--red);font-weight:500}
.progress-count{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted)}
.progress-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--red);border-radius:2px;transition:width .4s ease}
.btn-pause{flex-shrink:0;width:36px;height:36px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.btn-pause:active{background:var(--card)}
.btn-pause svg{width:16px;height:16px}
.stop-card{flex:1;overflow-y:auto;padding:24px 20px 16px;-webkit-overflow-scrolling:touch}
.stop-card::-webkit-scrollbar{display:none}
.sc-seq{font-family:'DM Mono',monospace;font-size:12px;color:var(--red);font-weight:500;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px}
.sc-name{font-size:24px;font-weight:700;color:var(--text);line-height:1.2;margin-bottom:4px}
.sc-code{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:16px}
.sc-divider{height:1px;background:var(--border);margin:16px 0}
.sc-field{margin-bottom:12px}
.sc-field-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}
.sc-field-value{font-size:14px;color:var(--text);font-weight:500;line-height:1.4}
.sc-obs-box{background:rgba(180,140,0,0.08);border:1px solid rgba(180,140,0,0.2);border-radius:6px;padding:10px 12px;margin-top:4px}
.sc-obs-label{font-size:10px;font-weight:600;color:#C4A000;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:3px}
.sc-obs-text{font-size:13px;color:#C4A000;font-weight:500}
.next-preview{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-top:4px}
.next-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:2px}
.next-name{font-size:13px;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next-arrow svg{width:14px;height:14px;color:var(--muted2)}
.nav-footer{flex-shrink:0;padding:12px 20px 28px;background:var(--dark);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.btn-maps{width:100%;height:52px;background:none;border:2px solid var(--red);color:var(--red);font-size:15px;font-weight:600;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-maps:active{background:var(--red-dim)}
.btn-maps svg{width:18px;height:18px;flex-shrink:0}
.btn-confirm{width:100%;height:56px;background:var(--green);border:none;color:#fff;font-size:16px;font-weight:600;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-confirm:active{opacity:0.85;transform:scale(0.99)}
.btn-confirm svg{width:20px;height:20px;flex-shrink:0}
.btn-confirm-label{font-size:11px;color:rgba(255,255,255,0.6);margin-top:1px}
#scr-done{justify-content:center;align-items:center;padding:32px 24px}
.done-icon{width:72px;height:72px;border-radius:50%;background:var(--green-dim);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.done-icon svg{width:32px;height:32px;color:var(--green)}
.done-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px}
.done-route{font-family:'DM Mono',monospace;font-size:14px;color:var(--red);text-align:center;margin-bottom:28px}
.done-stats{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:32px}
.done-stat{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:14px 16px;text-align:center}
.done-stat-label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
.done-stat-value{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--text)}
.btn-new{width:100%;height:52px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:15px;font-weight:600;border-radius:8px}
.btn-new:active{background:var(--card)}
.empty-state{padding:48px 20px;text-align:center;color:var(--muted);font-size:14px}
a.tel-link{color:var(--text);text-decoration:none;display:flex;align-items:center;gap:6px}
a.tel-link:active{color:var(--red)}
a.tel-link svg{width:14px;height:14px;color:var(--red);flex-shrink:0}
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-logo">Unilabs</span>
    <div class="brand-sep"></div>
    <span class="brand-sub">RouteGuide</span>
  </div>
  <div style="display:flex;gap:8px">
    <button class="btn-icon" id="btn-regions" onclick="toggleRegions()" aria-label="Filtrar região" title="Regiões">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
    </button>
  </div>
</header>

<!-- SCREEN 1: LISTA DE ROTAS -->
<div class="screen active" id="scr-list">
  <div class="list-header">
    <div class="day-info">
      <span class="day-pill mono" id="today-label">—</span>
      <span class="deadline-pill mono">⬤ Lab 18:00</span>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Pesquisar rota, motorista ou localidade..." oninput="renderList()" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" onclick="setFilter(this,'all')">Todas</button>
      <button class="filter-chip" onclick="setFilter(this,'Principal')">Principal</button>
      <button class="filter-chip" onclick="setFilter(this,'Sábado')">Sábado</button>
      <button class="filter-chip" onclick="setFilter(this,'Tarde')">Tarde</button>
      <button class="filter-chip" onclick="setFilter(this,'Bidiária')">Bidiária</button>
    </div>
  </div>
  <div class="scroll">
    <div class="routes-list" id="routesList"></div>
  </div>
</div>

<!-- SCREEN 2: VISÃO GERAL DA ROTA -->
<div class="screen" id="scr-overview">
  <div class="ov-header">
    <button class="back-btn" onclick="showScreen('scr-list')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Selecionar outra rota
    </button>
    <div class="ov-route-title">
      <div class="ov-code mono" id="ov-code">—</div>
      <div class="ov-type-badge" id="ov-badge"></div>
    </div>
    <div class="ov-region" id="ov-region"></div>
    <div class="ov-driver" id="ov-driver"></div>
    <div class="stats-row">
      <div class="stat-box"><div class="stat-label">Paragens</div><div class="stat-value mono" id="ov-stops">—</div></div>
      <div class="stat-box"><div class="stat-label">Prazo Lab.</div><div class="stat-value mono">18:00</div></div>
    </div>
  </div>
  <div class="ov-stops-header">
    <span class="ov-stops-label">Sequência de recolha</span>
    <button class="btn-edit" id="editBtn" onclick="toggleEdit()">Editar ordem</button>
  </div>
  <div class="stops-scroll" id="stopsList"></div>
  <div class="ov-footer">
    <button class="btn-start" onclick="startRoute()">
      <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      Iniciar rota
    </button>
    <div class="edit-note" id="editNote" style="display:none">Arrasta as paragens para reorganizar a sequência</div>
  </div>
</div>

<!-- SCREEN 3: NAVEGAÇÃO ATIVA -->
<div class="screen" id="scr-active">
  <div class="nav-top">
    <div class="progress-wrap">
      <div class="progress-label">
        <span class="progress-route mono" id="nav-route-code">—</span>
        <span class="progress-count mono" id="nav-progress">—</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="nav-bar" style="width:0%"></div></div>
    </div>
    <button class="btn-pause" onclick="pauseRoute()" aria-label="Pausar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="10" y1="5" x2="10" y2="19"/><line x1="14" y1="5" x2="14" y2="19"/></svg>
    </button>
  </div>
  <div class="stop-card scroll" id="stop-card">
    <div class="sc-seq" id="sc-seq">PARAGEM —</div>
    <div class="sc-name" id="sc-name">—</div>
    <div class="sc-code mono" id="sc-code">—</div>
    <div class="sc-divider"></div>
    <div class="sc-field" id="sc-addr-wrap"><div class="sc-field-label">Morada</div><div class="sc-field-value" id="sc-addr">—</div></div>
    <div class="sc-field" id="sc-time-wrap" style="display:none"><div class="sc-field-label">Horário previsto</div><div class="sc-field-value mono" id="sc-time">—</div></div>
    <div class="sc-field" id="sc-tel-wrap" style="display:none">
      <div class="sc-field-label">Telefone</div>
      <a class="tel-link sc-field-value" id="sc-tel" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3-8.59A2 2 0 0 1 3.68 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.64a16 16 0 0 0 7.45 7.45l1-1.02a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span id="sc-tel-text">—</span>
      </a>
    </div>
    <div class="sc-obs-box" id="sc-obs-wrap" style="display:none"><div class="sc-obs-label">⚠ Observações</div><div class="sc-obs-text" id="sc-obs">—</div></div>
    <div class="sc-divider" id="sc-next-divider" style="display:none"></div>
    <div class="next-preview" id="sc-next" style="display:none">
      <div style="flex:1;min-width:0"><div class="next-label">Próxima paragem</div><div class="next-name" id="sc-next-name">—</div></div>
      <div class="next-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
    </div>
  </div>
  <div class="nav-footer">
    <button class="btn-maps" onclick="openMaps()" id="btn-maps">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
      Seguir no Google Maps
    </button>
    <button class="btn-confirm" onclick="confirmStop()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      <div><div>Recolha confirmada</div><div class="btn-confirm-label" id="confirm-sub">→ Próximo ponto</div></div>
    </button>
  </div>
</div>

<!-- SCREEN 4: CONCLUSÃO -->
<div class="screen" id="scr-done">
  <div class="done-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
  <div class="done-title">Rota concluída</div>
  <div class="done-route mono" id="done-route">—</div>
  <div class="done-stats">
    <div class="done-stat"><div class="done-stat-label">Paragens</div><div class="done-stat-value" id="done-stops">—</div></div>
    <div class="done-stat"><div class="done-stat-label">Duração</div><div class="done-stat-value" id="done-dur">—</div></div>
    <div class="done-stat"><div class="done-stat-label">Início</div><div class="done-stat-value" id="done-start">—</div></div>
    <div class="done-stat"><div class="done-stat-label">Chegada</div><div class="done-stat-value" id="done-end">—</div></div>
  </div>
  <button class="btn-new" onclick="showScreen('scr-list');renderList()">← Nova rota</button>

let state={filter:'all',regionFilter:'all',selectedId:null,stops:[],currentIdx:0,startTime:null,editing:false,dragSrc:null};

(function init(){
  const now=new Date();
  const days=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const months=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  document.getElementById('today-label').textContent=days[now.getDay()]+' '+now.getDate()+' '+months[now.getMonth()];
  renderList();
})();

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function setFilter(el,f){
  document.querySelectorAll('.filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  state.filter=f;
  renderList();
}

function toggleRegions(){
  const q=prompt('Filtrar por região (ex: Porto, Lisboa, Coimbra, Faro, Viseu)\nDeixar em branco para ver todas:','');
  if(q===null) return;
  state.regionFilter=q.trim().toLowerCase()||'all';
  renderList();
}

function renderList(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const container=document.getElementById('routesList');
  const typeColors={Principal:'tp',Sábado:'ts',Tarde:'tt',Bidiária:'tb'};
  
  const entries=Object.entries(ROUTES).filter(([id,r])=>{
    if(state.filter!=='all'&&r.type!==state.filter) return false;
    if(state.regionFilter!=='all'&&!r.region.toLowerCase().includes(state.regionFilter)) return false;
    if(q&&!id.toLowerCase().includes(q)&&!r.region.toLowerCase().includes(q)&&!(r.driver||'').toLowerCase().includes(q)) return false;
    return true;
  });

  if(!entries.length){container.innerHTML='<div class="empty-state">Nenhuma rota encontrada</div>';return;}

  container.innerHTML=entries.map(([id,r])=>`
    <div class="route-item" onclick="selectRoute('${id}')">
      <div class="route-code">${id}</div>
      <div class="route-info">
        <div class="route-region">${r.region}</div>
        <div class="route-meta">
          <span class="type-badge ${typeColors[r.type]||'tp'}">${r.type}</span>
          <span class="stop-count">${r.stops.length} paragens</span>
          ${r.driver?`<span class="route-driver">${r.driver}</span>`:''}
        </div>
      </div>
      <div class="route-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div>
    </div>
  `).join('');
}

function selectRoute(id){
  state.selectedId=id;state.editing=false;
  const r=ROUTES[id];
  state.stops=[...r.stops];
  const typeColors={Principal:'tp',Sábado:'ts',Tarde:'tt',Bidiária:'tb'};
  document.getElementById('ov-code').textContent=id;
  const badge=document.getElementById('ov-badge');
  badge.textContent=r.type;badge.className='ov-type-badge '+(typeColors[r.type]||'tp');
  document.getElementById('ov-region').textContent=r.region;
  document.getElementById('ov-driver').textContent=r.driver?'Motorista habitual: '+r.driver:'';
  document.getElementById('ov-stops').textContent=r.stops.length;
  document.getElementById('editNote').style.display='none';
  document.getElementById('editBtn').textContent='Editar ordem';
  renderStopsList();
  showScreen('scr-overview');
  document.querySelector('#scr-overview .stops-scroll').scrollTop=0;
}

function renderStopsList(){
  const container=document.getElementById('stopsList');
  container.innerHTML=state.stops.map((s,i)=>`
    <div class="stop-row" draggable="${state.editing}" data-idx="${i}"
      ondragstart="dragStart(event,${i})" ondragover="dragOver(event)" ondrop="dragDrop(event,${i})" ondragend="dragEnd(event)">
      <div class="stop-num">${i+1}</div>
      <div class="stop-info">
        <div class="stop-name">${s.n}</div>
        <div style="display:flex;gap:8px;align-items:center;margin-top:2px">
          ${s.t?`<span class="stop-time">${s.t}</span>`:''}
          ${s.obs?`<span class="stop-obs">⚠ ${s.obs.substring(0,36)}${s.obs.length>36?'…':''}</span>`:''}
        </div>
      </div>
      ${state.editing?`<div class="drag-handle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></div>`:''}
    </div>
  `).join('');
}

function toggleEdit(){
  state.editing=!state.editing;
  document.getElementById('editBtn').textContent=state.editing?'Concluir':'Editar ordem';
  document.getElementById('editNote').style.display=state.editing?'block':'none';
  renderStopsList();
}

function dragStart(e,idx){if(!state.editing)return;state.dragSrc=idx;e.dataTransfer.effectAllowed='move';e.currentTarget.style.opacity='0.4'}
function dragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move'}
function dragDrop(e,idx){
  e.preventDefault();if(state.dragSrc===null||state.dragSrc===idx)return;
  const moved=state.stops.splice(state.dragSrc,1)[0];
  state.stops.splice(idx,0,moved);state.dragSrc=null;renderStopsList();
}
function dragEnd(e){e.currentTarget.style.opacity='';state.dragSrc=null}

// Touch drag
(function(){
  let ts=null,tt=null,ghost=null;
  document.addEventListener('touchstart',e=>{
    const h=e.target.closest('.drag-handle');
    if(!h||!state.editing)return;
    const row=h.closest('.stop-row');ts=parseInt(row.dataset.idx);
    ghost=row.cloneNode(true);
    ghost.style.cssText='position:fixed;left:16px;right:16px;opacity:0.7;z-index:999;pointer-events:none;background:var(--card);border-radius:6px;';
    document.body.appendChild(ghost);
  },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(ts===null)return;
    const t=e.touches[0];
    if(ghost)ghost.style.top=(t.clientY-28)+'px';
    const el=document.elementFromPoint(t.clientX,t.clientY);
    const row=el&&el.closest('.stop-row');
    if(row)tt=parseInt(row.dataset.idx);
  },{passive:true});
  document.addEventListener('touchend',()=>{
    if(ghost){ghost.remove();ghost=null}
    if(ts!==null&&tt!==null&&ts!==tt){const m=state.stops.splice(ts,1)[0];state.stops.splice(tt,0,m);renderStopsList();}
    ts=null;tt=null;
  });
})();

function startRoute(){
  state.currentIdx=0;state.startTime=new Date();
  renderActiveStop();showScreen('scr-active');
}

function renderActiveStop(){
  const s=state.stops[state.currentIdx];
  const total=state.stops.length;
  const pct=Math.round((state.currentIdx/total)*100);
  const next=state.stops[state.currentIdx+1];
  document.getElementById('nav-route-code').textContent='Rota '+state.selectedId;
  document.getElementById('nav-progress').textContent=(state.currentIdx+1)+' / '+total;
  document.getElementById('nav-bar').style.width=pct+'%';
  document.getElementById('sc-seq').textContent='PARAGEM '+(state.currentIdx+1)+' DE '+total;
  document.getElementById('sc-name').textContent=s.n;
  document.getElementById('sc-code').textContent=s.cod;
  document.getElementById('sc-addr').textContent=s.addr||'—';
  const tw=document.getElementById('sc-time-wrap');
  if(s.t){document.getElementById('sc-time').textContent=s.t;tw.style.display='block'}else{tw.style.display='none'}
  const telw=document.getElementById('sc-tel-wrap');
  if(s.tel&&s.tel.trim()){
    document.getElementById('sc-tel-text').textContent=s.tel;
    document.getElementById('sc-tel').href='tel:'+s.tel.replace(/\s/g,'');
    telw.style.display='block';
  }else{telw.style.display='none'}
  const obsw=document.getElementById('sc-obs-wrap');
  if(s.obs&&s.obs.trim()){document.getElementById('sc-obs').textContent=s.obs;obsw.style.display='block'}else{obsw.style.display='none'}
  const hasMaps=s.la&&s.ln;
  document.getElementById('btn-maps').style.display=hasMaps?'flex':'none';
  const ne=document.getElementById('sc-next');const nd=document.getElementById('sc-next-divider');
  if(next){
    document.getElementById('sc-next-name').textContent=next.n;
    ne.style.display='flex';nd.style.display='block';
    document.getElementById('confirm-sub').textContent='→ '+next.n.substring(0,28)+(next.n.length>28?'…':'');
  }else{ne.style.display='none';nd.style.display='none';document.getElementById('confirm-sub').textContent='→ Concluir rota';}
  document.getElementById('stop-card').scrollTop=0;
}

function openMaps(){
  const s=state.stops[state.currentIdx];
  if(!s.la||!s.ln)return;
  window.open('https://www.google.com/maps/dir/?api=1&destination='+s.la+','+s.ln,'_blank');
}

function confirmStop(){
  if(state.currentIdx<state.stops.length-1){state.currentIdx++;renderActiveStop();}
  else{showCompletion();}
}

function pauseRoute(){if(confirm('Pausar e voltar à rota?'))showScreen('scr-overview');}

function showCompletion(){
  const end=new Date();
  const dur=Math.round((end-state.startTime)/60000);
  const h=d=>d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
  document.getElementById('done-route').textContent='Rota '+state.selectedId;
  document.getElementById('done-stops').textContent=state.stops.length;
  document.getElementById('done-dur').textContent=dur+'min';
  document.getElementById('done-start').textContent=h(state.startTime);
  document.getElementById('done-end').textContent=h(end);
  showScreen('scr-done');
}
</script>
